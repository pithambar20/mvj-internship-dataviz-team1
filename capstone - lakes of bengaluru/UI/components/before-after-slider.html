<!-- Reusable Component: Before/After Comparison Slider -->
<div class="before-after-wrapper">
  <div class="comparison-container" id="{{slider_id}}">
    <!-- After Image / State (Underneath) -->
    <div class="img-after" style="background-image: url('{{after_image}}');">
      <span class="badge-tag after-tag">AFTER REJUVENATION</span>
    </div>

    <!-- Before Image / State (Clipped Overlay) -->
    <div class="img-before" style="background-image: url('{{before_image}}'); width: 50%;">
      <span class="badge-tag before-tag">BEFORE RESTORATION</span>
    </div>

    <!-- Draggable Divider -->
    <div class="slider-handle" style="left: 50%;">
      <div class="handle-arrow">&#8596;</div>
    </div>
  </div>
</div>
