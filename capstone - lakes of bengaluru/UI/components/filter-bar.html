<!-- Reusable Component: Filter Bar Template -->
<div class="filter-bar">
  <div class="filter-group">
    <label for="filter-zone">Zone</label>
    <select id="filter-zone" class="filter-select">
      <option value="all">All Zones</option>
      <option value="Mahadevapura">Mahadevapura</option>
      <option value="Bommanahalli">Bommanahalli</option>
      <option value="Yelahanka">Yelahanka</option>
      <option value="Bangalore South">Bangalore South</option>
      <option value="Bangalore East">Bangalore East</option>
      <option value="Bangalore West">Bangalore West</option>
      <option value="Rajarajeshwari Nagar">Rajarajeshwari Nagar</option>
      <option value="Dasarahalli">Dasarahalli</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-status">Status</label>
    <select id="filter-status" class="filter-select">
      <option value="all">All Statuses</option>
      <option value="Developed / Rejuvenated">Developed / Rejuvenated</option>
      <option value="Work in Progress">Work in Progress</option>
      <option value="To Be Developed">To Be Developed</option>
      <option value="Degraded / Encroached">Degraded / Encroached</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filter-search">Search Lake</label>
    <input type="text" id="filter-search" class="filter-input" placeholder="Type lake or ward name...">
  </div>

  <button id="btn-reset-filters" class="btn btn-secondary">Reset Filters</button>
</div>
